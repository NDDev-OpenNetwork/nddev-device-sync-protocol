openapi: 3.1.0
info:
  title: NDS control-plane v2 contract
  version: 2.0.0-alpha.13
  license:
    name: AGPL-3.0-only
  description: 'Versioned wire contract, not runtime capability discovery. JSON/NDJSON
    and native OTLP request bodies are bounded to 65536 bytes. Authentication secrets
    never enter logs or URLs. All responses use Cache-Control: no-store. Existing
    v1 health/readiness/source routes are documented separately. Runtime adapters
    and platform acceptance determine availability. Browser application requests opt
    in with X-NDS-Client: browser from the configured HTTPS origin. The browser adapter
    uses an HttpOnly cookie, exact-origin checks for mutations, custom-header CSRF
    protection and no CORS. Device signatures remain independently required. Browser
    mode never returns a session token in JSON; native bearer responses are unchanged.'
servers:
- url: https://self-hosted.example.invalid
paths:
  /v2/auth/methods:
    get:
      operationId: getAuthMethods
      description: Availability is derived from valid runtime provider configuration
        and readiness, not a standalone enabled flag. It does not guarantee email
        delivery.
      responses:
        '200':
          description: Current method availability
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/AuthMethods
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/email/challenges:
    post:
      operationId: requestEmailChallenge
      description: Return the same response shape for permitted and other addresses;
        no public registration. Email/OTP values are sensitive. A resend invalidates
        the prior challenge.
      responses:
        '202':
          description: Challenge accepted without revealing address authorization
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/EmailChallenge
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/EmailChallengeRequest
      parameters:
      - $ref: '#/components/parameters/SupportedLanguage'
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/email/verify:
    post:
      operationId: verifyEmailChallenge
      description: Atomically consume a valid owner challenge once and issue the shared
        NDS session.
      responses:
        '200':
          $ref: '#/components/responses/Response200'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/EmailVerifyRequest
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/github/start:
    post:
      operationId: startGithubAuthorization
      description: Server creates S256 PKCE and state for its fixed configured callback.
        Return a separate app-held exchange token. No client-controlled callback or
        automatic account linking.
      responses:
        '200':
          description: Launch authorization_url in the system browser; retain exchange_token
            privately
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/GithubStart
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/SupportedLanguage'
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/github/callback:
    get:
      operationId: completeGithubAuthorization
      description: Fixed operator-configured callback. Verify state, exchange using
        the server-held S256 verifier, and match the privately configured stable GitHub
        subject. It does not issue an NDS token in a URL or page. Browser outcome
        is generic; the initiating app uses its exchange token. Reject ambiguous success/error
        query combinations. A successful provider callback enters AwaitingApproval,
        not an exchangeable state. Display verification_code and an explicit Approve/Deny
        form; set a flow-bound __Host-nds-approval cookie and hidden CSRF token. The
        code is a comparison hint, not an email OTP or bearer credential.
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: code
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: error
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Return-to-app page; no session token, OTP, verifier, private
            owner or provider details
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid callback
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '429':
          description: Bounded callback capacity exceeded
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '503':
          description: Identity provider unavailable
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
  /v2/auth/github/exchange:
    post:
      operationId: exchangeGithubAuthorization
      description: 'Bounded polling by the initiating app; one successful exchange
        atomically consumes the flow. Expired or consumed flows fail. The NDS session
        is identical to email sign-in. Provider success alone is insufficient: remain
        pending until explicit browser approval. Denial is terminal.'
      responses:
        '200':
          $ref: '#/components/responses/Response200'
        '202':
          description: Authorization is still pending
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/GithubPending
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/GithubExchangeRequest
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/session:
    get:
      operationId: getSession
      description: Read metadata for the authenticated owner session.
      responses:
        '200':
          description: Session metadata
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Session
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - ownerSession: &id001 []
      - browserSession: *id001
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
    delete:
      operationId: revokeSession
      description: Revoke the current owner session.
      responses:
        '204':
          description: Session revoked
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - ownerSession: &id002 []
      - browserSession: *id002
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/devices/challenges:
    post:
      operationId: requestEnrollment
      description: Bind the challenge to this owner, public key, metadata and newly
        assigned device ID. Lifetime is at most five minutes.
      responses:
        '201':
          description: Single-use enrollment challenge
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/EnrollmentChallenge
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/EnrollmentRequest
      security:
      - ownerSession: &id003 []
      - browserSession: *id003
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/devices/enrollments:
    post:
      operationId: completeEnrollment
      description: Verify Ed25519 possession and consume the bound challenge atomically.
        Device enrollment does not grant existing vault keys.
      responses:
        '201':
          description: Enrolled device
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Device
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/EnrollmentProof
      security:
      - ownerSession: &id004 []
      - browserSession: *id004
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/devices:
    get:
      operationId: listDevices
      description: Only devices owned by the authenticated owner; opaque cursor and
        finite page size.
      responses:
        '200':
          description: Owned devices
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/DeviceList
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - ownerSession: &id005 []
      - browserSession: *id005
      parameters:
      - name: cursor
        in: query
        schema:
          $ref: ../contracts/v2/control-plane.schema.json#/$defs/Identifier
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/BrowserClient'
  /v2/devices/{device_id}:
    parameters:
    - name: device_id
      in: path
      required: true
      schema:
        $ref: ../contracts/v2/control-plane.schema.json#/$defs/Identifier
    delete:
      operationId: revokeDevice
      description: Owner authorization is checked; revocation blocks subsequent signed
        operations.
      responses:
        '204':
          description: Device revoked
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - ownerSession: &id006 []
      - browserSession: *id006
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/sync/operations:
    post:
      operationId: appendSyncOperation
      description: Validate the owning entity payload schema, authenticated device
        and optimistic revision. Store original result atomically; replay returns
        the same status/body. See docs/protocol-v2.md for signature, idempotency and
        retention semantics.
      responses:
        '200':
          description: Applied or original successful replay
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/SyncApplied
        '409':
          description: Persisted version conflict, or idempotency key reused with
            a different request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: ../contracts/v2/control-plane.schema.json#/$defs/SyncConflict
                - $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/SyncOperation
      security:
      - ownerSession: &id007 []
        deviceSignature: &id008 []
      - browserSession: *id007
        deviceSignature: *id008
      parameters:
      - &id011
        $ref: '#/components/parameters/SignatureInput'
      - &id012
        $ref: '#/components/parameters/Signature'
      - &id013
        $ref: '#/components/parameters/ContentDigest'
      - $ref: '#/components/parameters/BrowserClient'
    get:
      operationId: readSyncOperations
      description: Read a bounded, commit-ordered owner stream. Expired cursors return
        cursor_expired; never silently skip retained history.
      responses:
        '200':
          description: Committed operations and their original outcomes
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/SyncPage
        '410':
          description: Cursor history expired; explicit resynchronization required
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - ownerSession: &id009 []
        deviceSignature: &id010 []
      - browserSession: *id009
        deviceSignature: *id010
      parameters:
      - *id011
      - *id012
      - *id013
      - name: after_seq
        in: query
        schema:
          $ref: ../contracts/v2/control-plane.schema.json#/$defs/Revision
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/github/approve:
    post:
      operationId: approveGithubAuthorization
      description: Same-origin explicit browser approval after provider verification.
        Validate the cookie, flow, expiry and one-use CSRF token atomically; approve
        enables the app exchange, deny terminates it. Clear the cookie on terminal
        outcome. Neither response nor redirect exposes an NDS token.
      security:
      - browserApproval: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/GithubApprovalForm
      responses:
        '200':
          description: Generic approval/denial page; no NDS session token, email OTP
            or PKCE verifier
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid decision or form
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '401':
          description: Missing, expired or mismatched approval cookie/CSRF
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '429':
          description: Approval request limit
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '503':
          description: Dependency unavailable or capacity exhausted
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
  /v2/vault/key:
    post:
      operationId: ensureVaultKey
      description: Native authenticated HTTPS key delivery with RFC 9421 signatures
        and nonce admission. Server-managed encrypted key envelopes preserve the established
        owner key. Bodies are secret and must never enter presentation, transcripts
        or telemetry.
      security:
      - ownerSession: &id014 []
        deviceSignature: &id015 []
      - browserSession: *id014
        deviceSignature: *id015
      parameters:
      - *id011
      - *id012
      - *id013
      - $ref: '#/components/parameters/BrowserClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/VaultKeyRequest
      responses:
        '200':
          description: Native-only owner key; Cache-Control no-store
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/VaultKey
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '409':
          description: Persisted version conflict, or idempotency key reused with
            a different request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: ../contracts/v2/control-plane.schema.json#/$defs/SyncConflict
                - $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
  /v2/auth/passkeys/start:
    post:
      operationId: startPasskeyAuthorization
      description: Five-minute native/browser WebAuthn handoff. Registration requires
        an owner session issued in the last five minutes; login uses existing owner
        credentials. Native exchange token never enters browser URLs or presentation.
        Browser compares the app code before performing user-verified WebAuthn. At
        most 16 owner credentials and 128 live handoffs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/PasskeyRequest
      responses:
        '200':
          description: Native handoff; retain exchange token in Rust only
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/PasskeyStart
        '400': &id016
          $ref: '#/components/responses/InvalidRequest'
        '401': &id017
          $ref: '#/components/responses/AuthenticationFailed'
        '429': &id018
          $ref: '#/components/responses/RateLimited'
        '503': &id019
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/passkeys/exchange:
    post:
      operationId: exchangePasskeyAuthorization
      description: One-use exchange bound to the native exchange token. Authentication
        atomically updates the maintained WebAuthn credential and issues an owner
        session. Registration preserves the existing session. Expiry, failed verification
        and replay are terminal; pending polling is bounded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/control-plane.schema.json#/$defs/GithubExchangeRequest
      responses:
        '200':
          description: Owner session or completed registration
          content:
            application/json:
              schema:
                oneOf:
                - $ref: ../contracts/v2/control-plane.schema.json#/$defs/SessionIssued
                - $ref: ../contracts/v2/control-plane.schema.json#/$defs/BrowserSessionIssued
                - $ref: ../contracts/v2/control-plane.schema.json#/$defs/PasskeyStatus
        '202':
          description: Browser verification pending
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/PasskeyStatus
        '400': *id016
        '401': *id017
        '429': *id018
        '503': *id019
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/passkeys/browser:
    get:
      operationId: browserPasskeyBrowser
      description: Same-origin WebAuthn browser adapter. Five-minute HttpOnly Secure
        SameSite=Strict flow cookie, exact CSRF header and exact origin on verification;
        replay fails. Standard creation/assertion JSON is owned by webauthn-rs and
        the browser WebAuthn API. Verification body is limited to 16 KiB. No NDS session
        credential is returned to the browser.
      parameters:
      - name: flow_id
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
      responses:
        '200':
          description: Browser handoff page or WebAuthn response
        '400': *id016
        '401': *id017
        '429': *id018
        '503': *id019
  /v2/auth/passkeys/options:
    get:
      operationId: optionsPasskeyBrowser
      description: Same-origin WebAuthn browser adapter. Five-minute HttpOnly Secure
        SameSite=Strict flow cookie, exact CSRF header and exact origin on verification;
        replay fails. Standard creation/assertion JSON is owned by webauthn-rs and
        the browser WebAuthn API. Verification body is limited to 16 KiB. No NDS session
        credential is returned to the browser.
      parameters:
      - name: flow_id
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
      responses:
        '200':
          description: Browser handoff page or WebAuthn response
        '400': *id016
        '401': *id017
        '429': *id018
        '503': *id019
  /v2/auth/passkeys/verify:
    post:
      operationId: verifyPasskeyBrowser
      description: Same-origin WebAuthn browser adapter. Five-minute HttpOnly Secure
        SameSite=Strict flow cookie, exact CSRF header and exact origin on verification;
        replay fails. Standard creation/assertion JSON is owned by webauthn-rs and
        the browser WebAuthn API. Verification body is limited to 16 KiB. No NDS session
        credential is returned to the browser.
      parameters:
      - name: flow_id
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
      responses:
        '200':
          description: Browser handoff page or WebAuthn response
        '400': *id016
        '401': *id017
        '429': *id018
        '503': *id019
  /v2/observability/events:
    post:
      operationId: submitClientEvents
      description: At most 32 closed canonical telemetry events as NDJSON. Server
        binds tenant/user/device and namespaces producer identity. Replays use fresh
        signatures and identical event bytes; collector deduplication has a finite
        one-hour horizon. Disabled export returns a disabled receipt without delivery.
      security:
      - ownerSession: &id020 []
        deviceSignature: &id021 []
      - browserSession: *id020
        deviceSignature: *id021
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/ContentDigest'
      - $ref: '#/components/parameters/BrowserClient'
      responses:
        '200':
          description: Authenticated result; export receipts acknowledge transport
            acceptance only.
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/observability.schema.json#/$defs/IngressReceipt
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              minLength: 1
              maxLength: 65536
              description: Each nonempty line conforms to telemetry-event.schema.json
                and is at most 16 KiB; maximum 32 events.
  /v2/observability/traces:
    post:
      operationId: submitClientTraces
      description: At most 32 real native spans in an OTLP ExportTraceServiceRequest
        protobuf. The closed native projection excludes raw events, links, tracestate,
        arbitrary attributes and client-supplied ownership. Server attaches tenant/user/device.
        Retries may duplicate spans; no durable or exactly-once trace delivery is
        promised. Disabled export returns a disabled receipt.
      security:
      - ownerSession: &id022 []
        deviceSignature: &id023 []
      - browserSession: *id022
        deviceSignature: *id023
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/ContentDigest'
      - $ref: '#/components/parameters/BrowserClient'
      responses:
        '200':
          description: Authenticated result; export receipts acknowledge transport
            acceptance only.
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/observability.schema.json#/$defs/IngressReceipt
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: OTLP ExportTraceServiceRequest, maximum 65536 encoded bytes.
  /v2/observability/status:
    get:
      operationId: readClientObservabilityStatus
      description: Owner-scoped pipeline status. Configured export mode and collector
        transport acknowledgement are distinct from searchable delivery.
      security:
      - ownerSession: &id024 []
        deviceSignature: &id025 []
      - browserSession: *id024
        deviceSignature: *id025
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/ContentDigest'
      - $ref: '#/components/parameters/BrowserClient'
      responses:
        '200':
          description: Authenticated result; export receipts acknowledge transport
            acceptance only.
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/observability.schema.json#/$defs/ObservabilityStatus
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v2/observability/incidents:
    get:
      operationId: listClientIncidents
      description: At most 50 incidents for the configured bootstrap owner. Use next_cursor
        as after; source timestamps describe freshness.
      security:
      - ownerSession: &id026 []
        deviceSignature: &id027 []
      - browserSession: *id026
        deviceSignature: *id027
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/ContentDigest'
      - name: after
        in: query
        schema:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9_.:-]*$
      - $ref: '#/components/parameters/BrowserClient'
      responses:
        '200':
          description: Authenticated result; export receipts acknowledge transport
            acceptance only.
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/observability.schema.json#/$defs/IncidentPage
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v2/observability/incidents/{id}/acknowledge:
    post:
      operationId: acknowledgeClientIncident
      description: Revision-checked owner action. Persist and retry the same operation_id
        and body after an uncertain outcome; expired UUIDv7 action IDs cannot become
        new.
      security:
      - ownerSession: &id028 []
        deviceSignature: &id029 []
      - browserSession: *id028
        deviceSignature: *id029
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/ContentDigest'
      - name: id
        in: path
        required: true
        schema:
          $ref: ../contracts/v2/observability.schema.json#/$defs/Identifier
      - $ref: '#/components/parameters/BrowserClient'
      responses:
        '200':
          description: Authenticated result; export receipts acknowledge transport
            acceptance only.
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/observability.schema.json#/$defs/Incident
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          description: Revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/observability.schema.json#/$defs/IncidentAction
  /v2/observability/incidents/{id}/silence:
    post:
      operationId: silenceClientIncident
      description: Revision-checked owner action. Persist and retry the same operation_id
        and body after an uncertain outcome; expired UUIDv7 action IDs cannot become
        new.
      security:
      - ownerSession: &id030 []
        deviceSignature: &id031 []
      - browserSession: *id030
        deviceSignature: *id031
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/ContentDigest'
      - name: id
        in: path
        required: true
        schema:
          $ref: ../contracts/v2/observability.schema.json#/$defs/Identifier
      - $ref: '#/components/parameters/BrowserClient'
      responses:
        '200':
          description: Authenticated result; export receipts acknowledge transport
            acceptance only.
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/observability.schema.json#/$defs/Incident
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          description: Revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../contracts/v2/observability.schema.json#/$defs/SilenceAction
  /v2/auth/passkeys:
    get:
      operationId: listOwnerPasskeys
      description: List at most 16 public credential fingerprints and registration
        timestamps for the authenticated owner. No public-key bodies or authenticator
        secrets are returned.
      security:
      - ownerSession: &id032 []
      - browserSession: *id032
      responses:
        '200':
          description: Owner passkey metadata
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/PasskeyList
        '400': &id034
          $ref: '#/components/responses/InvalidRequest'
        '401': &id035
          $ref: '#/components/responses/AuthenticationFailed'
        '503': &id036
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/BrowserClient'
  /v2/auth/passkeys/{id}:
    delete:
      operationId: revokeOwnerPasskey
      description: Requires an owner session authenticated within five minutes; authorization
        is checked again under the mutation transaction. Revoke the credential and
        its issued sessions atomically. Legacy passkey sessions without credential
        linkage are also revoked when a credential is removed. Vault and device keys
        are unchanged. A missing fingerprint is idempotently absent.
      security:
      - ownerSession: &id033 []
      - browserSession: *id033
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
          minLength: 64
          maxLength: 64
      - $ref: '#/components/parameters/BrowserClient'
      responses:
        '200':
          description: Revocation committed; current_session_revoked identifies the
            caller login state
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/PasskeyRevocation
        '400': *id034
        '401': *id035
        '503': *id036
  /v2/browser:
    get:
      operationId: getBrowserCapabilities
      description: Returns the cookie/device/replica contract only when the same-origin
        browser adapter is configured. This does not qualify browser storage or imply
        offline freshness.
      responses:
        '200':
          description: Browser adapter contract
          content:
            application/json:
              schema:
                $ref: ../contracts/v2/control-plane.schema.json#/$defs/BrowserCapabilities
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    ownerSession:
      type: http
      scheme: bearer
      description: Opaque, expiring NDS owner session issued by email OTP, GitHub
        OAuth PKCE or passkey.
    deviceSignature:
      type: apiKey
      in: header
      name: Signature
      description: 'Signature alone is insufficient: validate the RFC 9421 profile
        and Content-Digest specified in docs/protocol-v2.md. A registered public key
        is not a bearer secret.'
    browserApproval:
      type: apiKey
      in: cookie
      name: __Host-nds-approval
      description: Flow-bound approval cookie; Secure, HttpOnly, SameSite=Strict,
        Path=/, no Domain. Require the matching one-use CSRF token as well.
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-nds-session
      description: Secure, HttpOnly, SameSite=Strict, Path=/, no Domain. Accepted
        only by the explicitly selected same-origin browser adapter. Never a substitute
        for deviceSignature.
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
    AuthenticationFailed:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
    RateLimited:
      description: Rate or capacity limit
      content:
        application/json:
          schema:
            $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
    ServiceUnavailable:
      description: Dependency unavailable or server busy
      content:
        application/json:
          schema:
            $ref: ../contracts/v2/control-plane.schema.json#/$defs/Error
    Response200:
      description: 'Owner session. Native clients receive SessionIssued; X-NDS-Client:
        browser receives BrowserSessionIssued with Set-Cookie, never session_token.
        Do not log either response.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: ../contracts/v2/control-plane.schema.json#/$defs/SessionIssued
            - $ref: ../contracts/v2/control-plane.schema.json#/$defs/BrowserSessionIssued
  parameters:
    SupportedLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Initiating app locale for email/browser copy; bound to the flow.
        API error identifiers remain English.
      schema:
        type: string
        enum:
        - en
        - ru
        default: en
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: RFC 9421; the nds signature covers @method, @target-uri and content-digest,
        with created, expires, nonce, keyid and alg=ed25519.
    Signature:
      name: Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
      description: RFC 9421 Ed25519 signature under label nds.
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: RFC 9530 sha-256 over exact request content; empty content is also
        digested.
    BrowserClient:
      name: X-NDS-Client
      in: header
      required: false
      description: Select the same-origin cookie adapter. Reject duplicate/unknown
        values, concurrent bearer Authorization, foreign Origin or cross-site fetch
        metadata. Mutation Origin must exactly match the configured public origin.
        Browser requests do not accept cross-origin credentialed access.
      schema:
        type: string
        enum:
        - browser
