openapi: 3.1.0
info:
  title: NDS implemented server baseline
  version: 0.0.1-alpha.7
  license:
    name: AGPL-3.0-only
  description: Actual baseline routes. module_count counts descriptors, not functioning
    adapters. telemetry_enabled reports configured emission, not verified pipeline
    delivery. Planned authentication and sync are specified separately in v2.
servers:
- url: https://self-hosted.example.invalid
paths:
  /v1/health:
    get:
      operationId: getHealth
      x-implementation-status: implemented
      responses:
        '200':
          description: Current server response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            x-request-id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: ../contracts/v1/health-response.schema.json
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /v1/ready:
    get:
      operationId: getReadiness
      x-implementation-status: implemented
      responses:
        '200':
          description: Current server response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            x-request-id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id001
                $ref: ../contracts/v1/ready-response.schema.json
        '503':
          description: Dependency degraded or admission capacity exceeded
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            x-request-id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                oneOf:
                - *id001
                - &id002
                  $ref: ../contracts/v1/error-response.schema.json
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /source:
    get:
      operationId: getSourceOffer
      x-implementation-status: implemented
      responses:
        '200':
          description: Current server response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            x-request-id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: ../contracts/v1/source-response.schema.json
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
components:
  responses:
    ServiceUnavailable:
      description: Dependency degraded or admission capacity exceeded
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        x-request-id:
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema: *id002
    RequestTimeout:
      description: Request deadline exceeded
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        x-request-id:
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema: *id002
